name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BatteryMonitor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BatteryMonitor/package-lock.json

      # node-hid is a native addon that only matters on the machine running
      # Stream Deck. It is loaded lazily and its absence just disables the HID
      # providers, so CI does not need it built.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm test
