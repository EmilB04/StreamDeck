name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # One job per plugin. Each plugin is self-contained, so the same steps run
    # in each directory; a failure in one doesn't cancel the other's result.
    strategy:
      fail-fast: false
      matrix:
        plugin: [BatteryMonitor, AudioSwitch]
    name: check (${{ matrix.plugin }})
    defaults:
      run:
        working-directory: ${{ matrix.plugin }}

    steps:
      - uses: actions/checkout@v7

      # 20 because that is what the manifest's `Nodejs.Version` declares, i.e. the
      # runtime Stream Deck actually starts the plugin under. It is unrelated to
      # the Node the actions above run on — that one follows their major version.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.plugin }}/package-lock.json

      # Battery Monitor's node-hid is a native addon that only matters on the
      # machine running Stream Deck. It is loaded lazily and its absence just
      # disables the HID providers, so CI does not need it built. Audio Switch
      # has no install scripts to skip.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm test
